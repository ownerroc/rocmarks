<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RocMarks</title>
  <link rel="stylesheet" href="styles.css">
  <script src="browser-polyfill.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <!-- Login view -->
  <div id="loginView" class="view">
    <div class="header">
      <h1 data-i18n="appTitle">RocMarks</h1>
      <p class="subtitle">
<span data-i18n="loginSubtitle">This tool is designed for XBrowser bookmark synchronization. If you don't have an account, please </span><a href="https://www.xbext.com" target="_blank" data-i18n="[href]registerLinkUrl;registerLink">download XBrowser to register</a>
      </p>
    </div>

    <div class="login-form">
      <div class="input-group">
        <label for="username" data-i18n="username">Username</label>
        <input type="text" id="username" data-i18n-placeholder="usernamePlaceholder" autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password" data-i18n="password">Password</label>
        <input type="password" id="password" data-i18n-placeholder="passwordPlaceholder" autocomplete="current-password">
      </div>

      <button id="loginBtn" class="primary-btn" data-i18n="loginButton">Log in</button>

      <div id="loginStatus" class="status-message"></div>

      <button id="customServerToggle" class="settings-toggle" data-i18n="customServerToggle">Custom server</button>
    </div>
  </div>

  <!-- Main view -->
  <div id="mainView" class="view hidden">
    <div class="user-profile">
      <img id="userAvatar" class="avatar" src="icons/default-avatar.png" alt="Avatar">
      <h2 id="userNickname" class="username">User</h2>
      <div class="bookmark-info">
        <svg class="bookmark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span id="bookmarkCount">0</span> <span data-i18n="bookmarkCount">bookmarks</span>
      </div>

      <button id="serverLine" class="server-line">
        <span data-i18n="serverLabel">Server</span>: <span id="serverValue">—</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="sync-section">
      <button id="uploadBtn" class="sync-btn primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <span data-i18n="syncToCloud">Sync to cloud</span>
      </button>

      <button id="downloadBtn" class="sync-btn secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
        </svg>
        <span data-i18n="syncFromCloud">Sync from cloud</span>
      </button>

      <label class="checkbox-option">
        <input type="checkbox" id="overwriteCloud">
        <span data-i18n="overwriteCloud">Overwrite cloud with local bookmarks</span>
      </label>
    </div>

    <div id="syncStatus" class="status-message"></div>

    <div class="divider"></div>

    <div class="logout-section">
      <button id="logoutBtn" class="logout-btn">
        <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span data-i18n="logout">Log out</span>
      </button>
    </div>
  </div>

  <!-- Custom server settings (shared, outside the switchable views) -->
  <div class="server-settings">
    <div id="customServerPanel" class="custom-server-panel hidden">
      <div class="input-group">
        <label for="customServerInput" data-i18n="customServerLabel">Sync server address</label>
        <input type="text" id="customServerInput" data-i18n-placeholder="customServerPlaceholder" placeholder="https://your-server.example.com" spellcheck="false" autocomplete="off">
      </div>
      <div class="custom-server-actions">
        <button id="customServerSaveBtn" class="mini-btn primary" data-i18n="customServerSave">Save</button>
        <button id="customServerResetBtn" class="mini-btn" data-i18n="customServerReset">Use official server</button>
      </div>
      <div id="customServerStatus" class="status-message"></div>
      <p class="settings-hint" data-i18n="customServerHint">Point RocMarks at a self-hosted sync server (see SELF_HOSTED.md). Switching servers logs you out.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
